name: Build & Sign Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Cancel previous in-flight runs to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Fast Build & Sign Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Gradle caching to dramatically speed up consecutive runs
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Prepare Signing Keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom keystore from secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "STORE_PASS=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Using deterministic release keystore for reproducible app updates..."
            # Check if project has debug.keystore or create with fixed deterministic parameters
            if [ -f "debug.keystore" ]; then
              cp debug.keystore release.keystore
            else
              keytool -genkeypair -v \
                -keystore release.keystore \
                -alias mluona_release \
                -keyalg RSA \
                -keysize 2048 \
                -validity 20000 \
                -storepass mluona123456 \
                -keypass mluona123456 \
                -dname "CN=Mluona IPTV,O=Mluona,C=LY"
            fi
            echo "KEY_ALIAS=mluona_release" >> $GITHUB_ENV
            echo "STORE_PASS=mluona123456" >> $GITHUB_ENV
            echo "KEY_PASS=mluona123456" >> $GITHUB_ENV
          fi

          # Ensure debug.keystore exists in root and ~/.android for local/debug builds
          if [ ! -f "debug.keystore" ]; then
            cp release.keystore debug.keystore
          fi
          cp debug.keystore ~/.android/debug.keystore

      # Build optimized Release APK
      - name: Assemble Release APK
        run: |
          ./gradlew assembleRelease \
            -x test \
            -x lint \
            --parallel \
            --build-cache

      # Sign with apksigner (v1, v2, v3 schemes) so Android TV and mobile install smoothly
      - name: Sign APK with apksigner
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found APK to sign at: $APK_PATH"
          
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          $APKSIGNER sign --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$STORE_PASS" \
            --key-pass "pass:$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/release/mluona-iptv-release.apk \
            "$APK_PATH"
          
          $APKSIGNER verify --verbose app/build/outputs/apk/release/mluona-iptv-release.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mluona-iptv-release-apk
          path: app/build/outputs/apk/release/mluona-iptv-release.apk
          if-no-files-found: error
          retention-days: 14
